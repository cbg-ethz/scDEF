site_name: scDEF
site_url: https://cbg-ethz.github.io/scDEF/

theme:
  name: "material"
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
      primary: indigo
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
      primary: indigo
  favicon: assets/images/icon.svg
  logo: assets/images/icon.svg
  custom_dir: docs/overrides/


# Without pymdownx.highlight the fenced blocks in the .md pages render as plain
# unstyled <pre> -- mkdocs' builtin `fenced_code` marks up the block but nothing
# colours it. `toc` and `tables` are mkdocs builtins and stay enabled whether or
# not they appear here; `toc` is repeated below only to set `permalink`.
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  # Highlights inline code carrying a shebang hint, e.g. `#!python model.fit()`.
  - pymdownx.inlinehilite
  # Superset of `fenced_code`; also what lets a fence sit inside a list item or
  # an admonition without breaking out of it.
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true

nav:
  - Getting started: index.md
  - Examples:
    - Basic usage: examples/basicusage.md
    - Getting started with 3k PBMCs: examples/scdef-pbmcs3k.ipynb
    - Cell type hierarchies in a whole adult animal: examples/scdef-planaria.ipynb
    - Integrating two batches of PBMCs: examples/scdef-pbmcs-2batches.ipynb
    - Identifying interferon-response between two batches of PBMCs: examples/scdef-ifn.ipynb
  - API Reference:
    - Analysis workflow: workflow.md
    - Reference: api.md

repo_name: scDEF
repo_url: https://github.com/cbg-ethz/scDEF

watch:
  - src/scdef
