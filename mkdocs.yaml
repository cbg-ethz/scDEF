site_name: scDEF
site_url: https://cbg-ethz.github.io/scDEF/

theme:
  name: "material"
  features:
    - navigation.tabs
    - navigation.indexes    # a section can have its own landing page (reference/index.md)
    # NOT navigation.sections: it renders every group as a flat, always-open header, which
    # is what made the API tree an unnavigable wall. Without it the groups COLLAPSE and only
    # the one holding the current page is expanded.
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - toc.integrate         # fold the page TOC into the left sidebar -> a single left nav
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: en
  # iscc's palette: a black header with indigo accents, and `media` so the site
  # follows the reader's OS theme on first visit instead of always opening light.
  # The toggle then overrides that choice and is remembered.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  favicon: assets/images/icon.svg
  logo: assets/images/icon.svg
  custom_dir: overrides/

extra_css:
  - stylesheets/nav.css


# Without pymdownx.highlight the fenced blocks in the .md pages render as plain
# unstyled <pre> -- mkdocs' builtin `fenced_code` marks up the block but nothing
# colours it. `toc` and `tables` are mkdocs builtins and stay enabled whether or
# not they appear here; `toc` is repeated below only to set `permalink`.
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  # Highlights inline code carrying a shebang hint, e.g. `#!python model.fit()`.
  - pymdownx.inlinehilite
  # Superset of `fenced_code`; also what lets a fence sit inside a list item or
  # an admonition without breaking out of it.
  - pymdownx.superfences
  - toc:
      permalink: true

# mkdocs logs a link to a missing *anchor* at INFO, so `--strict` does not fail on
# it: splitting Installation out of index.md broke `index.md#installation` in
# basicusage.md and the strict build stayed green. Raising these to warnings makes
# --strict catch a dangling link the way it already catches an unresolved
# mkdocstrings reference.
validation:
  anchors: warn
  absolute_links: warn
  unrecognized_links: warn

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]          # griffe reads docstrings statically from src/ (no import needed)
          options:
            docstring_style: google    # the codebase documents params Google-style (Args:)
            show_root_heading: true
            show_root_full_path: true  # heading shows the public call path, e.g. scdef.tl.filter
            show_bases: true
            show_source: false
            # NOT inherited_members: iscDEF and sscDEF subclass scDEF, which has 43 public
            # methods -- inheriting them would bury each subclass's own API. The subclass
            # docstrings link to the scDEF page for the shared parameters instead.
            inherited_members: false
            merge_init_into_class: true
            docstring_section_style: table
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            summary: true
            members_order: source
            filters: ["!^_"]
            heading_level: 1

nav:
  - Overview: index.md
  - Installation: installation.md
  # The nav label is "Tutorials" but the directory stays docs/examples/: renaming it
  # would change every published /examples/... URL, which external links point at.
  - Tutorials:
      - Basic usage: examples/basicusage.md
      - Getting started with 3k PBMCs: examples/scdef-pbmcs3k.ipynb
      - Cell type hierarchies in a whole adult animal: examples/scdef-planaria.ipynb
      - Integrating two batches of PBMCs: examples/scdef-pbmcs-2batches.ipynb
      - Identifying interferon-response between two batches of PBMCs: examples/scdef-ifn.ipynb
  - API Reference:
      # The section index (navigation.indexes): clicking 'API Reference' lands here.
      - reference/index.md
      - Analysis workflow: workflow.md
      - Models:
          - scDEF: reference/scDEF.md
          - iscDEF: reference/iscDEF.md
          - sscDEF (experimental): reference/sscDEF.md
      - Model construction:
